# ClaudeVN Platform - v2.0 Architecture
# Serving + Marketplace + Redis (compute environments are planning-derived)
#
# Usage:
#   docker compose up -d          # Start all services
#   docker compose down           # Stop services
#   docker compose logs -f        # View logs
#   docker compose build          # Rebuild after changes
#
# Services:
#   serving      → Intelligence layer at http://localhost:8002
#   marketplace  → Skill marketplace at http://localhost:8003
#   redis        → Redis at localhost:6379 (state, auth tokens)
#
# Compute:
#   v2.0 computes are derived from Layer 1 planning. The system analyzes
#   your goals, detects runtime requirements, generates a Dockerfile,
#   and you approve before anything is provisioned. No pre-configured
#   compute instances.
#
# Authentication:
#   Default: AUTH_MODE=bypass (no login required, dev user assumed)
#   Cognito: Create a .env file with AUTH_MODE=cognito + Cognito vars
#
# Claude Credentials:
#   Serving uses Claude Code CLI with OAuth. Authorize via the UI on
#   first load — the token is stored in Redis and applied to the
#   process environment for all CLI calls.

services:
  # Redis - State management, auth tokens, event coordination
  redis:
    image: redis:7-alpine
    container_name: claudevn-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - claudevn-network
    restart: unless-stopped

  # Skill Marketplace - Standalone skill catalog
  marketplace:
    build:
      context: .
      dockerfile: marketplace/Dockerfile
    container_name: claudevn-marketplace
    ports:
      - "8003:8003"
    environment:
      - MARKETPLACE_HOST=0.0.0.0
      - MARKETPLACE_PORT=8003
      - SKILLS_PATH=/app/skills
      - LOG_LEVEL=INFO
      - CORS_ORIGINS=*
      - API_VERSION=v1
      - MARKETPLACE_REQUIRE_AUTH=false
      - SERVING_URL=http://serving:8002
      - REGISTER_ON_STARTUP=true
      - HEARTBEAT_INTERVAL=60
      - MARKETPLACE_NAME=ClaudeVN-Marketplace
      - MARKETPLACE_TIER=root
      - MARKETPLACE_ENDPOINT=http://marketplace:8003
    volumes:
      - marketplace_skills:/app/skills
    networks:
      - claudevn-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8003/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  # Serving - Intelligence Layer (Plan, Execute, Verify)
  serving:
    build:
      context: .
      dockerfile: serving/Dockerfile
    container_name: claudevn-serving
    ports:
      - "8002:8002"
    environment:
      # Server
      - SERVING_HOST=0.0.0.0
      - SERVING_PORT=8002
      - LOG_LEVEL=INFO
      - CORS_ORIGINS=*
      - API_VERSION=v1
      # Storage
      - STORAGE_PATH=/app/data/serving
      # Health monitoring
      - HEALTH_CHECK_INTERVAL=30
      - DEGRADED_THRESHOLD=60
      - OFFLINE_THRESHOLD=90
      - MAX_FAILED_CHECKS=3
      - AUTO_DEREGISTER=false
      # Redis
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_DB=0
      - "REDIS_KEY_PREFIX=claudevn:"
      # Git infrastructure
      - GIT_REPOS_PATH=/app/data/repos
      - GIT_SSH_KEYS_PATH=/app/data/ssh_keys
      - GIT_HOOK_REDIS_NOTIFY=true
      # Marketplace service
      - MARKETPLACE_URL=http://marketplace:8003
      # Rate limiting - disable for local development
      - RATE_LIMIT_ENABLED=false
      # Claude authentication credentials path
      - CLAUDE_CREDENTIALS_PATH=/app/data/serving/claude-credentials
      # Authentication - local for dev, cognito for production (set in .env)
      - AUTH_MODE=${AUTH_MODE:-local}
      - LOCAL_USERS_FILE=users.local
      - COGNITO_USER_POOL_ID=${COGNITO_USER_POOL_ID:-}
      - COGNITO_APP_CLIENT_ID=${COGNITO_APP_CLIENT_ID:-}
      - COGNITO_REGION=${COGNITO_REGION:-us-east-1}
      - COGNITO_ADMIN_ENABLED=${COGNITO_ADMIN_ENABLED:-false}
      # v2.0: Serving URL for internal references
      - SERVING_PUBLIC_URL=http://serving:8002
    volumes:
      - serving_data:/app/data
      - serving_logs:/app/logs
    networks:
      - claudevn-network
    depends_on:
      redis:
        condition: service_healthy
      marketplace:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

# Named volumes for data persistence
volumes:
  redis_data:
    driver: local
  serving_data:
    driver: local
  serving_logs:
    driver: local
  marketplace_skills:
    driver: local

# Network for inter-service communication
networks:
  claudevn-network:
    driver: bridge

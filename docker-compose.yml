  #       condition: service_healthy
  #   healthcheck:
  #     test: ["CMD", "curl", "-f", "http://localhost:8012/api/v1/health"]
  #     interval: 30s
  #     timeout: 10s
  #     retries: 3
  #     start_period: 30s
  #   restart: unless-stopped

# Named volumes for data persistence
volumes:
  redis_data:
    driver: local
  serving_data:
    driver: local
  serving_logs:
    driver: local
  marketplace_skills:
    driver: local
  compute1_data:
    driver: local
  compute1_logs:
    driver: local
  compute2_data:  # TEMPORARILY DISABLED
    driver: local
  compute2_logs:  # TEMPORARILY DISABLED
    driver: local
  # compute3_data:  # TEMPORARILY DISABLED
  #   driver: local
  # compute3_logs:  # TEMPORARILY DISABLED
  #   driver: local

# Network for inter-service communication
networks:
  claudevn-network:
    driver: bridge

# =============================================================================
# External VCN Node Template (for nodes joining from other hosts/subscriptions)
# =============================================================================
# External compute nodes can bring their own Claude OAuth credentials,
# or use COMPUTE_AUTH_MODE=serving to fetch from a remote Serving instance.
# To add an external node:
#
# 1. Create a docker-compose.override.yml with:
#
#   services:
#     compute-external:
#       build:
#         context: .
#         dockerfile: compute/Dockerfile
#       container_name: claudevn-compute-external
#       environment:
#         - COMPUTE_INSTANCE_ID=compute-ext-001
#         - COMPUTE_INSTANCE_NAME=Compute-External
#         - SERVING_URL=http://<serving-host>:8002
#         - COMPUTE_AUTH_MODE=serving  # or "external" with own credentials
#         - CLAUDEVN_SERVING_AUTH_URL=http://<serving-host>:8002/api/v1/auth
#         - COMPUTE_SKILLS=code-writer
#         - COMPUTE_CAPABILITIES=python
#       # Network: Must be able to reach Serving (e.g., via VPN, public IP, or overlay network)
#
# 3. For multi-host deployment, consider:
#    - Docker Swarm overlay network
#    - Tailscale/WireGuard VPN
#    - Public Serving endpoint with TLS
# =============================================================================

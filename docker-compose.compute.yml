# ClaudeVN Platform - Remote Compute Instance Configuration
# Standalone docker-compose for deploying compute instances independently
#
# Usage:
#   cp .env.compute.example .env.compute    # Create environment file
#   vim .env.compute                        # Configure CLAUDEVN_SERVING_URL and other settings
#   docker compose -f docker-compose.compute.yml up -d
#
# This compose file is designed for remote compute instances that connect to
# an existing ClaudeVN Serving instance running elsewhere. It does NOT include
# Redis, Serving, or Marketplace services - those are assumed to be remote.
#
# Prerequisites:
#   - Accessible Serving instance (configure CLAUDEVN_SERVING_URL in .env.compute)
#   - Network connectivity to Serving (HTTPS outbound only)
#   - Full repository checkout (for build context)
#
# Counterpart:
#   The Serving hub is deployed using docker-compose.serving.yml + .env.serving
#   Set CLAUDEVN_API_KEY here to match COMPUTE_REGISTRATION_TOKEN on the Serving side.
#
# Authentication Modes:
#   serving  - Fetch Claude credentials from remote Serving instance (default)
#   external - Use own Claude credentials (mount volume or configure separately)
#
# Scaling:
#   To run multiple compute instances, edit .env.compute and duplicate this file
#   with unique CLAUDEVN_COMPUTE_ID and container_name values.
#
# Note on env_file vs environment:
#   env_file injects vars into the container runtime only - NOT into compose ${} interpolation.
#   This file avoids ${VAR} references that depend on .env.compute values. All such vars
#   are passed through automatically by the env_file directive. Only hardcoded defaults
#   appear in the environment block.

services:
  # Remote Compute Instance
  # No HTTP server, no ports. Connects outbound to Serving via SSE.
  # Healthcheck uses heartbeat file updated on each SSE keepalive.
  compute:
    build:
      context: .
      dockerfile: compute/Dockerfile
    container_name: claudevn-compute-remote
    env_file:
      - .env.compute
    environment:
      # Hardcoded defaults (not user-configurable via .env.compute)
      - COMPUTE_STORAGE_PATH=/app/data/compute
      - COMPUTE_LOG_FILE=/app/logs/compute.log

      # Always-on flags
      - COMPUTE_REGISTER_ON_STARTUP=true
      - MCP_ENABLED=true

      # All other vars (COMPUTE_INSTANCE_ID, COMPUTE_INSTANCE_NAME,
      # SERVING_URL, CLAUDEVN_SERVING_URL, CLAUDEVN_SERVING_AUTH_URL,
      # COMPUTE_HEARTBEAT_INTERVAL, COMPUTE_SKILLS, COMPUTE_CAPABILITIES,
      # CLAUDEVN_RESOURCES_CPU, CLAUDEVN_RESOURCES_MEMORY, COMPUTE_AUTH_MODE,
      # LOG_LEVEL) are injected directly from .env.compute via env_file above.

    # For local testing with Caddy TLS on a .local domain, the container
    # needs to resolve the domain to the host. In production, DNS handles this.
    extra_hosts:
      - "claudevn.local:host-gateway"

    volumes:
      - compute_data:/app/data
      - compute_logs:/app/logs

    restart: unless-stopped

# Named volumes for data persistence
volumes:
  compute_data:
    driver: local
  compute_logs:
    driver: local

conflicts_with: []

constraints:
  - Do not implement code - only analyze and decompose
  - Do not create circular dependencies
  - Each issue must be independently verifiable
  - Keep dependency chains shallow (prefer wide over deep)
  - Always output results as a JSON object (not just text)
  - Include realistic complexity estimates

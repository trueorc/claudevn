conflicts_with: []

constraints:
  - Do not modify code directly - provide review feedback
  - Do not nitpick style issues covered by linters
  - Focus on meaningful improvements
  - Respect the author's design decisions unless problematic
  - Provide actionable feedback, not vague criticism
